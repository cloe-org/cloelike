[project]
name = "cloelike"
version = "0.1"
description = "cloelike is the likelihood module for Euclid primary observables for the CLOE project (Cosmology Likelihood for Observables in Euclid)"
authors = [
    { name = "M. Bonici", email = "marco.bonici@uwaterloo.ca" },
    { name = "G. Cañas-Herrera", email = "guadalupe.canasherrera@esa.int" },
    { name = "P. Carrilho", email = "pedro.carrilho@ed.ac.uk" },
    { name = "S. Casas", email = "casas@physik.rwth-aachen.de" },
    { name = "C. Moretti", email = "cmoretti@sissa.it" },
    { name = "A. Pezzotta", email = "andrea.pezzotta@inaf.it" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
test = [
    "pytest>=6.0",
]

[tool.poetry]
name = "cloelike"
version = "0.1"
description = "cloelike is the likelihood module for Euclid primary observables for the CLOE project (Cosmology Likelihood for Observables in Euclid)"
authors = [
    "M. Bonici <marco.bonici@uwaterloo.ca>",
    "G. Cañas-Herrera <guadalupe.canasherrera@esa.int>",
    "P. Carrilho <pedro.carrilho@ed.ac.uk>",
    "S. Casas <casas@physik.rwth-aachen.de>",
    "C. Moretti <cmoretti@sissa.it>",
    "A. Pezzotta <andrea.pezzotta@inaf.it>"
]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
numpy = "<2.0"
euclidlib = "v2025.2"
cloelib = { git = "https://github.com/cloe-org/cloelib.git", optional = true }

[tool.poetry.extras]
test = [
    "pytest>=6.0",
]