# =====================================================================
# cloe-org – Conda/Mamba Environment (Linux-compatible)
# ---------------------------------------------------------------------
# Environment name:
#   cloe-org-env-v2026.1
#
# Purpose:
#   - smoothly run cloe-org ecosystem on Linux
#
# How to use:
#   mamba env create -f cloe-org-env-v2026.1-linux.yaml
#   mamba activate cloe-org-env-v2026.1
#
# Notes:
#   - Built primarily from conda-forge
#   - Python 3.12
#   - Includes compiler toolchain (Clang/GCC) for C++/pybind11 (needed)
#   - pip section at the end for Euclid-specific and sampling packages
#   - This version uses flexible version constraints for cross-platform compatibility
# =====================================================================

name: cloe-org-env-v2026.1

# -----------------------------
# Conda channels
# -----------------------------
channels:
  - conda-forge

# -----------------------------
# Core dependencies
# -----------------------------
dependencies:
  # --- Python runtime ---
  - python>=3.12,<3.13
  - pip
  - setuptools
  - wheel

  # --- Scientific stack ---
  - numpy>=2.4
  - astropy
  - libblas=*=*openblas
  - libcblas=*=*openblas
  - liblapack=*=*openblas
  - libopenblas

  # --- GSL & numerical utilities ---
  - gsl
  - libgfortran5
  - libgfortran

  # --- C++ / compiler toolchain ---
  # Needed for pybind11, Boost, and compiled extensions
  - clang
  - llvm-tools
  - compiler-rt
  - gcc
  - llvm-openmp

  # --- Boost / pybind11 ---
  - boost>=1.85
  - libboost>=1.85
  - libboost-python>=1.85
  - libboost-python-devel>=1.85
  - pybind11>=3.0

  # --- Interactive & debugging tools ---
  - ipython
  - ipykernel
  - debugpy
  - jupyter_client
  - jupyter_core

  # --- Plotting / UX helpers ---
  - matplotlib-inline
  - pygments
  - prompt-toolkit
  - wcwidth

  # --- System & IO libraries ---
  - openssl
  - ca-certificates
  - libxml2
  - libsqlite
  - readline
  - ncurses
  - zstd
  - zeromq

  # --- Python utilities ---
  - packaging
  - psutil
  - typing_extensions
  - six
  - python-dateutil
  - tzdata

  # -----------------------------
  # pip-only dependencies
  # -----------------------------
  # Euclid- and project-specific packages not available via conda
  - pip:
      - euclidlib==2026.1
      - nautilus-sampler==1.0.6
      - seaborn==0.13.2
      - tf_keras==2.20.1
      - pre-commit
      - pytest
      - pytest-cov
      - satrapy

# ============================================================
# End of environment definition
# ============================================================
