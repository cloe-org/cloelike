name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  style:
    name: Style (Lint & Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pre-commit
        run: |
          pip install pre-commit
          pre-commit install

      - name: Run pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs: style
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Mambaforge
          miniforge-version: latest
          activate-environment: cloe-org-env-v2026.1
          use-mamba: true

      - name: Create environment from file
        run: mamba env update -n cloe-org-env-v2026.1 -f environments/cloe-org-env-v2026.1.yaml

      - name: Configure Git for private repo access
        run: git config --global url."https://${{ secrets.GH_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: Install cloelib
        run: |
          mamba run -n cloe-org-env-v2026.1 pip install git+https://github.com/cloe-org/cloelib.git

      - name: Install HMCode2020emu
        run: |
          mamba run -n cloe-org-env-v2026.1 pip install git+https://github.com/MariaTsedrik/HMcode2020Emu.git

      - name: Install CAMB
        run: |
          mamba run -n cloe-org-env-v2026.1 pip install camb

      - name: Install cloelike
        run: |
          mamba run -n cloe-org-env-v2026.1 pip install .

      - name: Run tests with coverage
        run: mamba run -n cloe-org-env-v2026.1 pytest -vv --cov=cloelike --cov-report=term-missing

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pipx run build
