name: JOSS paper

on:
  push:
    branches:
      - main
    paths:
      - joss/**
  pull_request:
    paths:
      - joss/**

permissions:
  contents: read

jobs:
  paper:
    name: Draft PDF
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@v1.0
        with:
          journal: joss
          paper-path: joss/paper.md

      - name: Upload PDF
        uses: actions/upload-artifact@v4
        with:
          name: paper
          path: joss/paper.pdf
